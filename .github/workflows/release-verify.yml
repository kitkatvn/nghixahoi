name: Release, after approval

# Run by hand once a maintainer has approved a staged version of @kitkatvn/nghixahoi with 2FA. It finds the release.yml runs of the
# tag cli-v<version>, downloads the record each kept, and checks with packages/nghixahoi-cli/scripts/release.mjs verify that npm
# serves that version with the integrity staged, and that its dist-tag points at it. Only this, passing, says a version is released:
# a stage can be approved, rejected or left, and none of that shows in release.yml's run.
#
# Actions > "Release, after approval" > Run workflow; or `gh workflow run release-verify.yml -f version=<version>`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version approved, such as 0.2.14'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: What npm serves
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Every release.yml run of the tag, and each one's records: a run that failed before it packed kept none. The
      # version reaches the commands through the environment, never into the script's text.
      - name: The release runs' records
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="cli-v$VERSION"
          records="$RUNNER_TEMP/records"
          mkdir -p "$records"
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$tag" --limit 20 --json databaseId --jq '.[].databaseId')"
          if [ -z "$runs" ]; then
            echo "::error title=Release::No release.yml run for the tag $tag."
            exit 1
          fi
          for run in $runs; do
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern "release-$tag-run-*" --dir "$records/$run" \
              || echo "Run $run kept no record of $tag."
          done

      - name: Check what npm serves against the record
        env:
          VERSION: ${{ inputs.version }}
        run: node packages/nghixahoi-cli/scripts/release.mjs verify --version "$VERSION" --records "$RUNNER_TEMP/records"
